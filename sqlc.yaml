version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query" # input directory
    schema: "db/migration"
    gen:
      go:
        package: "db"
        out: "db/sqlc" # output directory
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
